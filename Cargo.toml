[package]
name = "scramble-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Material Design 3 Expressive components, theming and desktop integration for iced"
repository = "https://github.com/scrambletools/scramble-ui"
include = ["src/**", "assets/**", "LICENSE-*", "README.md"]
exclude = ["vendor"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
iced = { version = "0.14", features = ["advanced"] }
material-colors = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "open_uri", "settings"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSColor", "NSColorSpace", "NSWorkspace", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

# Right to left text in text inputs; see vendor/PATCHES.md. Apps using this
# crate add the same section, pointing at these copies.
[patch.crates-io]
iced_graphics = { path = "vendor/iced_graphics" }
iced_widget = { path = "vendor/iced_widget" }
